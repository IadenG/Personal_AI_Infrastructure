<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mothership</title>
  <style>
    /* ── RESET & TOKENS ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0c0c0c;
      --surface:  #161616;
      --surface2: #1d1d1d;
      --border:   #282828;
      --text:     #efefef;
      --muted:    #5a5a5a;
      --accent:   #d4a843;
      --green:    #34d399;
      --red:      #f87171;
      --blue:     #60a5fa;
      --radius:   10px;
      --gap:      12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── APP SHELL ──────────────────────────────────────────────── */
    #app {
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px 24px 60px;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── TOP BAR ────────────────────────────────────────────────── */
    #topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 10px 0 6px;
    }

    #brand {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 5px;
      color: var(--accent);
      text-transform: uppercase;
    }

    #clock { font-size: 26px; font-weight: 700; letter-spacing: -1px; color: var(--text); font-variant-numeric: tabular-nums; }
    #date-label { display: block; font-size: 12px; color: var(--muted); text-align: right; margin-top: 2px; }

    /* ── QUOTE ──────────────────────────────────────────────────── */
    #quote-bar {
      background: #111;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 22px;
      display: flex;
      align-items: baseline;
      gap: 18px;
    }

    #quote-type { font-size: 9px; letter-spacing: 3px; color: var(--accent); font-weight: 700; flex-shrink: 0; text-transform: uppercase; }
    #quote-text { font-size: 13px; color: #bbb; line-height: 1.6; }

    /* ── STATS ROW ──────────────────────────────────────────────── */
    #stats-row {
      display: grid;
      grid-template-columns: 190px 210px 1fr;
      gap: var(--gap);
    }

    /* Weather */
    #temp-big { font-size: 52px; font-weight: 800; letter-spacing: -3px; line-height: 1; color: var(--text); }
    #temp-big span { font-size: 22px; font-weight: 400; color: var(--muted); }
    #weather-cond  { font-size: 13px; color: #999; margin-top: 8px; }
    #weather-range { font-size: 12px; color: var(--muted); margin-top: 3px; }
    #weather-rain  { font-size: 12px; color: var(--blue); font-weight: 600; margin-top: 8px; }

    /* Markets */
    .mkt-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); }
    .mkt-row:last-child { border-bottom: none; }
    .mkt-name  { font-weight: 600; font-size: 13px; }
    .mkt-right { text-align: right; }
    .mkt-price { font-family: 'SF Mono', 'Fira Mono', monospace; font-size: 13px; color: #999; }
    .mkt-chg   { font-size: 12px; font-weight: 700; margin-top: 1px; }
    .up   { color: var(--green); }
    .down { color: var(--red); }

    /* HOK */
    #hok-total    { font-size: 40px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
    #hok-subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; margin-bottom: 18px; }

    .hok-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
    .hok-row:last-child { margin-bottom: 0; }
    .hok-lbl   { font-size: 11px; color: var(--muted); width: 72px; flex-shrink: 0; }
    .hok-track { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .hok-fill  { height: 100%; border-radius: 3px; transition: width 0.7s cubic-bezier(.4,0,.2,1); }
    .fill-pipeline { background: var(--accent); }
    .fill-insystem { background: var(--blue); }
    .fill-sold     { background: var(--green); }
    .fill-shipped  { background: var(--muted); }
    .hok-count { font-size: 12px; font-weight: 700; width: 18px; text-align: right; color: var(--text); }

    /* ── TASKS ROW ──────────────────────────────────────────────── */
    #tasks-row {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: var(--gap);
    }

    /* Daily Tasks */
    .daily-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: opacity 0.2s;
      user-select: none;
    }
    .daily-item:last-child { border-bottom: none; }
    .daily-item:hover .task-box { border-color: var(--green); }
    .daily-item.done { opacity: 0.38; }
    .daily-item.done .task-name { text-decoration: line-through; color: var(--muted); }

    .task-box {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-radius: 4px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .daily-item.done .task-box { background: var(--green); border-color: var(--green); }
    .check-icon { display: none; font-size: 10px; color: #000; font-weight: 900; }
    .daily-item.done .check-icon { display: block; }
    .task-name { font-size: 14px; flex: 1; }
    .task-badge {
      font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
      color: var(--muted); background: var(--surface2);
      padding: 2px 6px; border-radius: 4px;
    }

    /* Rolling Tasks */
    #add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    #add-form input, #add-form select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    #add-form input:focus, #add-form select:focus { border-color: var(--accent); }
    #add-form select option { background: var(--surface2); }
    #inp-name { flex: 1; min-width: 180px; }
    #inp-cat  { width: 110px; }
    #inp-due  { width: 136px; }

    #btn-add {
      background: var(--accent); color: #000;
      border: none; border-radius: 6px;
      padding: 7px 16px; font-size: 13px; font-weight: 700;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      transition: opacity 0.15s;
    }
    #btn-add:hover { opacity: 0.82; }
    #btn-add:disabled { opacity: 0.4; cursor: default; }

    .rolling-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      transition: opacity 0.3s;
    }
    .rolling-item:last-child { border-bottom: none; }

    .roll-circle {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-radius: 50%;
      flex-shrink: 0;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .roll-circle:hover { border-color: var(--green); background: rgba(52,211,153,0.08); }

    .roll-info { flex: 1; min-width: 0; }
    .roll-name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .roll-meta { display: flex; gap: 8px; margin-top: 3px; align-items: center; }
    .roll-cat  { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
    .roll-due  { font-size: 11px; color: var(--muted); }
    .roll-due.overdue { color: var(--red); font-weight: 600; }

    /* ── CALENDAR ───────────────────────────────────────────────── */
    #cal-grid {
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .cal-col {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 8px;
      min-width: 78px;
    }
    .cal-col.today { border-color: var(--accent); background: #1b1709; }

    .cal-dow { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
    .cal-col.today .cal-dow { color: var(--accent); }
    .cal-num { font-size: 22px; font-weight: 800; color: var(--text); line-height: 1.1; margin: 3px 0 8px; }
    .cal-col.today .cal-num { color: var(--accent); }

    .cal-event {
      font-size: 11px; color: #999;
      background: var(--border);
      border-radius: 4px;
      padding: 3px 5px;
      margin-bottom: 3px;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      line-height: 1.3;
    }
    .cal-event.timed { color: var(--blue); background: rgba(96,165,250,0.08); }
    .cal-event.allday { color: var(--muted); }

    /* ── STATUS BAR ─────────────────────────────────────────────── */
    #statusbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 14px;
      font-size: 11px;
      color: var(--muted);
      padding: 0 2px;
    }

    #btn-refresh {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 5px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    #btn-refresh:hover { color: var(--text); border-color: var(--muted); }

    /* ── SKELETON LOADING ───────────────────────────────────────── */
    .skel { background: var(--surface2); border-radius: 4px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    /* ── SCHOOL + VX ROW ────────────────────────────────────────── */
    #edu-biz-row {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: var(--gap);
    }

    /* School — add form */
    #school-add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    #school-add-form input, #school-add-form select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    #school-add-form input:focus, #school-add-form select:focus { border-color: var(--accent); }
    #school-add-form select option { background: var(--surface2); }
    #sc-name { flex: 1; min-width: 200px; }
    #sc-course { width: 130px; }
    #sc-due { width: 136px; }
    #sc-priority { width: 90px; }
    #btn-sc-add {
      background: var(--accent); color: #000;
      border: none; border-radius: 6px;
      padding: 7px 14px; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: opacity 0.15s;
    }
    #btn-sc-add:hover { opacity: 0.82; }

    /* School — assignment items */
    .sc-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .sc-item:last-child { border-bottom: none; }
    .sc-box {
      width: 18px; height: 18px; margin-top: 1px;
      border: 2px solid var(--border);
      border-radius: 4px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .sc-item:hover .sc-box { border-color: var(--green); }
    .sc-check { display: none; font-size: 10px; color: #000; font-weight: 900; }
    .sc-info { flex: 1; min-width: 0; }
    .sc-name-text { font-size: 14px; line-height: 1.3; }
    .sc-meta { display: flex; gap: 8px; margin-top: 4px; align-items: center; flex-wrap: wrap; }
    .sc-course-badge {
      font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
      padding: 2px 6px; border-radius: 4px;
      background: rgba(96,165,250,0.12); color: var(--blue); font-weight: 700;
    }
    .sc-due-label { font-size: 11px; color: var(--muted); }
    .sc-due-label.urgent  { color: var(--red);    font-weight: 700; }
    .sc-due-label.soon    { color: #fb923c;        font-weight: 600; }
    .sc-high-badge {
      font-size: 10px; padding: 1px 5px; border-radius: 3px;
      background: rgba(248,113,113,0.12); color: var(--red); font-weight: 700; letter-spacing: 1px;
    }

    /* VX Queue */
    #vx-add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    #vx-add-form input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s;
      flex: 1;
    }
    #vx-add-form input:focus { border-color: var(--accent); }
    #btn-vx-add {
      background: var(--accent); color: #000;
      border: none; border-radius: 6px;
      padding: 7px 12px; font-size: 13px; font-weight: 700;
      cursor: pointer; white-space: nowrap;
    }
    #vx-add-form input#vx-week { width: 110px; flex: none; }

    .vx-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .vx-item:last-child { border-bottom: none; }
    .vx-title { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vx-stage {
      font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
      padding: 3px 8px; border-radius: 4px;
      cursor: pointer; font-weight: 700;
      transition: opacity 0.15s; flex-shrink: 0;
      user-select: none;
    }
    .vx-stage:hover { opacity: 0.7; }
    .stage-shot    { background: var(--border);               color: var(--muted); }
    .stage-editing { background: rgba(96,165,250,0.12);       color: var(--blue); }
    .stage-done    { background: rgba(52,211,153,0.12);       color: var(--green); }
    .stage-posted  { background: rgba(212,168,67,0.15);       color: var(--accent); }

    #vx-week-count {
      font-size: 11px; color: var(--muted);
      margin-bottom: 12px;
    }
    #vx-week-count span { color: var(--accent); font-weight: 700; }

    /* ── SCROLLBAR ──────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <header id="topbar">
    <div id="brand">Mothership</div>
    <div style="text-align:right;">
      <div id="clock">--:-- --</div>
      <span id="date-label">Loading...</span>
    </div>
  </header>

  <!-- QUOTE -->
  <div id="quote-bar">
    <span id="quote-type">&nbsp;</span>
    <span id="quote-text">Loading...</span>
  </div>

  <!-- STATS ROW: Weather · Markets · HOK -->
  <div id="stats-row">
    <div class="card" id="card-weather">
      <div class="section-label" id="weather-label">Weather</div>
      <div id="temp-big"><div class="skel" style="width:90px;height:52px;"></div></div>
      <div id="weather-cond"></div>
      <div id="weather-range"></div>
      <div id="weather-rain"></div>
    </div>

    <div class="card" id="card-markets">
      <div class="section-label">Markets</div>
      <div id="markets-list">
        <div class="skel" style="height:38px;margin-bottom:4px;"></div>
        <div class="skel" style="height:38px;margin-bottom:4px;"></div>
        <div class="skel" style="height:38px;"></div>
      </div>
    </div>

    <div class="card" id="card-hok">
      <div class="section-label">HOK &middot; Active Deals</div>
      <div id="hok-total">—</div>
      <div id="hok-subtitle">Loading...</div>
      <div id="hok-bars"></div>
    </div>
  </div>

  <!-- SCHOOL + VX ROW -->
  <div id="edu-biz-row">

    <!-- SCHOOL -->
    <div class="card">
      <div class="section-label">School · Upcoming Assignments</div>
      <div id="school-add-form">
        <input  id="sc-name"     type="text"   placeholder="Assignment name..." />
        <input  id="sc-course"   type="text"   placeholder="Course" />
        <input  id="sc-due"      type="date" />
        <select id="sc-priority">
          <option value="normal">Normal</option>
          <option value="high">High</option>
        </select>
        <button id="btn-sc-add" onclick="addSchoolItem()">+ Add</button>
      </div>
      <div id="school-list">
        <div class="skel" style="height:46px;margin-bottom:4px;"></div>
        <div class="skel" style="height:46px;margin-bottom:4px;"></div>
        <div class="skel" style="height:46px;"></div>
      </div>
    </div>

    <!-- VX QUEUE -->
    <div class="card">
      <div class="section-label">Versionex · Video Queue</div>
      <div id="vx-week-count">This week: <span id="vx-posted-count">—</span> / 4 posted</div>
      <div id="vx-add-form">
        <input id="vx-title" type="text"   placeholder="Video title..." />
        <input id="vx-week"  type="text"   placeholder="Week (e.g. W19)" />
        <button id="btn-vx-add" onclick="addVXItem()">+ Add</button>
      </div>
      <div id="vx-list">
        <div class="skel" style="height:40px;margin-bottom:4px;"></div>
        <div class="skel" style="height:40px;margin-bottom:4px;"></div>
        <div class="skel" style="height:40px;"></div>
      </div>
    </div>

  </div>

  <!-- TASKS ROW: Daily Ritual · Rolling Tasks -->
  <div id="tasks-row">
    <div class="card">
      <div class="section-label">Daily Ritual</div>
      <div id="daily-list">
        <div class="skel" style="height:42px;margin-bottom:4px;"></div>
        <div class="skel" style="height:42px;margin-bottom:4px;"></div>
        <div class="skel" style="height:42px;margin-bottom:4px;"></div>
        <div class="skel" style="height:42px;"></div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Rolling Tasks</div>
      <div id="add-form">
        <input  id="inp-name" type="text"   placeholder="New task..." />
        <select id="inp-cat">
          <option value="">Category</option>
          <option value="School">School</option>
          <option value="VX">VX</option>
          <option value="HOK">HOK</option>
          <option value="Appt">Appt</option>
          <option value="DEE">DEE</option>
          <option value="Personal">Personal</option>
          <option value="Other">Other</option>
        </select>
        <input  id="inp-due"  type="date" />
        <button id="btn-add"  onclick="addTask()">+ Add</button>
      </div>
      <div id="rolling-list">
        <div class="skel" style="height:46px;margin-bottom:4px;"></div>
        <div class="skel" style="height:46px;margin-bottom:4px;"></div>
        <div class="skel" style="height:46px;"></div>
      </div>
    </div>
  </div>

  <!-- CALENDAR: 14-day grid -->
  <div class="card">
    <div class="section-label">Next 14 Days</div>
    <div id="cal-grid"></div>
  </div>

  <!-- STATUS BAR -->
  <div id="statusbar">
    <span id="next-refresh"></span>
    <span id="last-updated">Loading...</span>
    <button id="btn-refresh" onclick="loadData()">Refresh now</button>
  </div>

</div>
<script>
/* ── CLOCK ─────────────────────────────────────────────────────── */
var DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var DAYS_S = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

function tickClock() {
  var now  = new Date();
  var h    = now.getHours(), m = now.getMinutes();
  var ampm = h >= 12 ? 'PM' : 'AM';
  document.getElementById('clock').textContent = ((h % 12) || 12) + ':' + pad(m) + ' ' + ampm;
  document.getElementById('date-label').textContent = DAYS[now.getDay()] + ', ' + MONTHS[now.getMonth()] + ' ' + now.getDate();
}
tickClock();
setInterval(tickClock, 1000);
function pad(n) { return n < 10 ? '0' + n : '' + n; }

/* ── DATE HELPERS ────────────────────────────────────────────────── */
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function isOverdue(dateStr) {
  if (!dateStr) return false;
  return dateStr < todayStr();
}
function friendlyDate(dateStr) {
  if (!dateStr) return '';
  var p = dateStr.split('-');
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return MONTHS[d.getMonth()].slice(0,3) + ' ' + d.getDate();
}

/* ── LOAD DATA ────────────────────────────────────────────────────── */
function loadData() {
  document.getElementById('last-updated').textContent = 'Refreshing...';
  google.script.run
    .withSuccessHandler(renderAll)
    .withFailureHandler(function(e) {
      document.getElementById('last-updated').textContent = 'Error — ' + e.message;
    })
    .getData();
}

function renderAll(d) {
  if (d.city) document.getElementById('weather-label').textContent = 'Weather · ' + d.city;
  renderQuote(d.quote);
  renderWeather(d.weather);
  renderMarkets(d.markets);
  renderHOK(d.hok);
  renderSchool(d.school);
  renderVX(d.vx);
  renderDailyTasks(d.dailyTasks);
  renderRollingTasks(d.rollingTasks);
  renderCalendar(d.calendar);
  document.getElementById('last-updated').textContent =
    'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

/* ── QUOTE ───────────────────────────────────────────────────────── */
function renderQuote(q) {
  if (!q) return;
  var m = q.match(/^\[(\w+)\]\s(.+)$/);
  document.getElementById('quote-type').textContent = m ? m[1] : '';
  document.getElementById('quote-text').textContent = m ? m[2] : q;
}

/* ── WEATHER ─────────────────────────────────────────────────────── */
function renderWeather(w) {
  if (!w) { document.getElementById('temp-big').textContent = '—'; return; }
  var cap = w.cond.charAt(0).toUpperCase() + w.cond.slice(1);
  document.getElementById('temp-big').innerHTML = w.temp + '<span>&deg;F</span>';
  document.getElementById('weather-cond').textContent  = cap;
  document.getElementById('weather-range').textContent = 'High ' + w.hi + '°  ·  Low ' + w.lo + '°';
  document.getElementById('weather-rain').textContent  = w.precip > 30 ? 'Rain ' + w.precip + '% — bring a jacket' : '';
}

/* ── MARKETS ─────────────────────────────────────────────────────── */
function renderMarkets(m) {
  var el = document.getElementById('markets-list');
  if (!m) { el.innerHTML = '<span style="color:var(--muted)">Unavailable</span>'; return; }
  var html = '';
  Object.keys(m).forEach(function(key) {
    var a = m[key];
    if (!a) return;
    var up  = a.chg >= 0;
    var p   = a.decimals > 0 ? '$' + a.price.toFixed(a.decimals) : '$' + Math.round(a.price).toLocaleString();
    var chg = (up ? '+' : '') + a.chg.toFixed(1) + '%';
    html += '<div class="mkt-row"><span class="mkt-name">' + a.label + '</span>' +
      '<div class="mkt-right"><div class="mkt-price">' + p + '</div>' +
      '<div class="mkt-chg ' + (up?'up':'down') + '">' + chg + '</div></div></div>';
  });
  el.innerHTML = html || '<span style="color:var(--muted)">Unavailable</span>';
}

/* ── HOK ─────────────────────────────────────────────────────────── */
function renderHOK(h) {
  document.getElementById('hok-total').textContent    = h.total || '0';
  document.getElementById('hok-subtitle').textContent = h.total === 0 ? 'No active deals' : 'active deals';
  var t = h.total || 1;
  function bar(label, n, cls) {
    var pct = Math.round(n / t * 100);
    return '<div class="hok-row">' +
      '<span class="hok-lbl">' + label + '</span>' +
      '<div class="hok-track"><div class="hok-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
      '<span class="hok-count">' + n + '</span></div>';
  }
  document.getElementById('hok-bars').innerHTML =
    bar('Pipeline',  h.pipeline, 'fill-pipeline') +
    bar('In System', h.inSystem, 'fill-insystem') +
    bar('Sold',      h.sold,     'fill-sold')     +
    bar('Shipped',   h.shipped,  'fill-shipped');
}

/* ── DAILY TASKS ─────────────────────────────────────────────────── */
function renderDailyTasks(tasks) {
  var el = document.getElementById('daily-list');
  if (!tasks || !tasks.length) {
    el.innerHTML = '<p style="color:var(--muted);font-size:13px;">Run initSheet() in Apps Script to seed tasks.</p>';
    return;
  }
  el.innerHTML = tasks.map(function(t) {
    return '<div class="daily-item' + (t.done ? ' done' : '') + '" id="d-' + t.id + '" onclick="toggleDaily(' + t.id + ',' + !t.done + ')">' +
      '<div class="task-box"><span class="check-icon">&#10003;</span></div>' +
      '<span class="task-name">' + t.name + '</span>' +
      (t.category ? '<span class="task-badge">' + t.category + '</span>' : '') +
    '</div>';
  }).join('');
}

function toggleDaily(id, newDone) {
  var el = document.getElementById('d-' + id);
  if (newDone) el.classList.add('done'); else el.classList.remove('done');
  google.script.run
    .withFailureHandler(function() {
      if (newDone) el.classList.remove('done'); else el.classList.add('done');
    })
    .markDailyTask(id, newDone);
}

/* ── ROLLING TASKS ───────────────────────────────────────────────── */
function renderRollingTasks(tasks) {
  var el = document.getElementById('rolling-list');
  if (!tasks || !tasks.length) {
    el.innerHTML = '<p style="color:var(--muted);font-size:13px;padding-top:6px;">No open tasks. Add one above.</p>';
    return;
  }
  el.innerHTML = tasks.map(function(t) {
    var od = isOverdue(t.dueDate);
    return '<div class="rolling-item" id="r-' + t.id + '">' +
      '<div class="roll-circle" onclick="completeRolling(' + t.id + ')"></div>' +
      '<div class="roll-info">' +
        '<div class="roll-name">' + t.name + '</div>' +
        '<div class="roll-meta">' +
          (t.category ? '<span class="roll-cat">' + t.category + '</span>' : '') +
          (t.dueDate  ? '<span class="roll-due' + (od?' overdue':'') + '">due ' + friendlyDate(t.dueDate) + (od?' — overdue':'') + '</span>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function completeRolling(id) {
  var el = document.getElementById('r-' + id);
  el.style.opacity = '0.25';
  el.style.pointerEvents = 'none';
  google.script.run
    .withSuccessHandler(function() { el.remove(); })
    .withFailureHandler(function() { el.style.opacity = '1'; el.style.pointerEvents = 'auto'; })
    .markRollingTask(id);
}

function addTask() {
  var name = document.getElementById('inp-name').value.trim();
  if (!name) return;
  var cat  = document.getElementById('inp-cat').value;
  var due  = document.getElementById('inp-due').value;
  var btn  = document.getElementById('btn-add');
  btn.textContent = '...';
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function() {
      document.getElementById('inp-name').value = '';
      document.getElementById('inp-cat').value  = '';
      document.getElementById('inp-due').value  = '';
      btn.textContent = '+ Add';
      btn.disabled = false;
      loadData();
    })
    .withFailureHandler(function() { btn.textContent = '+ Add'; btn.disabled = false; })
    .addRollingTask(name, cat, due);
}

/* ── CALENDAR ────────────────────────────────────────────────────── */
function renderCalendar(events) {
  var grid  = document.getElementById('cal-grid');
  var today = new Date(); today.setHours(0,0,0,0);

  // Index events by date string
  var evMap = {};
  (events || []).forEach(function(ev) {
    if (!evMap[ev.date]) evMap[ev.date] = [];
    evMap[ev.date].push(ev);
  });

  var html = '';
  for (var i = 0; i < 14; i++) {
    var d  = new Date(today);
    d.setDate(d.getDate() + i);
    var key = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());

    var evs    = evMap[key] || [];
    var evHtml = evs.map(function(ev) {
      var txt   = ev.time ? ev.time + ' ' + ev.title : ev.title;
      var cls   = ev.time ? 'timed' : 'allday';
      return '<div class="cal-event ' + cls + '" title="' + ev.title + '">' + txt + '</div>';
    }).join('');

    html += '<div class="cal-col' + (i === 0 ? ' today' : '') + '">' +
      '<div class="cal-dow">' + DAYS_S[d.getDay()] + '</div>' +
      '<div class="cal-num">' + d.getDate() + '</div>' +
      evHtml +
    '</div>';
  }
  grid.innerHTML = html;
}

/* ── SCHOOL ──────────────────────────────────────────────────────── */
function renderSchool(items) {
  var el = document.getElementById('school-list');
  if (!items || !items.length) {
    el.innerHTML = '<p style="color:var(--muted);font-size:13px;">No assignments. Add from syllabus above.</p>';
    return;
  }
  var today = todayStr();
  el.innerHTML = items.map(function(a) {
    var daysOut = a.dueDate ? Math.round((new Date(a.dueDate + 'T00:00:00') - new Date()) / 86400000) : 999;
    var urgCls  = daysOut <= 2 ? 'urgent' : daysOut <= 7 ? 'soon' : '';
    var dueText = a.dueDate ? friendlyDate(a.dueDate) + (daysOut <= 0 ? ' — TODAY' : daysOut === 1 ? ' — tomorrow' : ' — ' + daysOut + 'd') : '';
    return '<div class="sc-item" id="sc-' + a.id + '" onclick="completeSchool(' + a.id + ')">' +
      '<div class="sc-box"><span class="sc-check">&#10003;</span></div>' +
      '<div class="sc-info">' +
        '<div class="sc-name-text">' + a.name + '</div>' +
        '<div class="sc-meta">' +
          (a.course  ? '<span class="sc-course-badge">' + a.course + '</span>' : '') +
          (a.priority === 'high' ? '<span class="sc-high-badge">HIGH</span>' : '') +
          (dueText   ? '<span class="sc-due-label ' + urgCls + '">' + dueText + '</span>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function completeSchool(id) {
  var el = document.getElementById('sc-' + id);
  el.style.opacity = '0.25'; el.style.pointerEvents = 'none';
  google.script.run
    .withSuccessHandler(function() { el.remove(); })
    .withFailureHandler(function() { el.style.opacity = '1'; el.style.pointerEvents = 'auto'; })
    .markSchoolDone(id);
}

function addSchoolItem() {
  var name = document.getElementById('sc-name').value.trim();
  if (!name) return;
  var btn = document.getElementById('btn-sc-add');
  btn.textContent = '...'; btn.disabled = true;
  google.script.run
    .withSuccessHandler(function() {
      ['sc-name','sc-course','sc-due'].forEach(function(id){ document.getElementById(id).value=''; });
      document.getElementById('sc-priority').value = 'normal';
      btn.textContent = '+ Add'; btn.disabled = false;
      loadData();
    })
    .withFailureHandler(function() { btn.textContent = '+ Add'; btn.disabled = false; })
    .addSchoolAssignment(
      name,
      document.getElementById('sc-course').value,
      document.getElementById('sc-due').value,
      document.getElementById('sc-priority').value
    );
}

/* ── VX QUEUE ────────────────────────────────────────────────────── */
function renderVX(items) {
  var el = document.getElementById('vx-list');
  if (!items || !items.length) {
    el.innerHTML = '<p style="color:var(--muted);font-size:13px;">Queue empty. Add videos above.</p>';
    document.getElementById('vx-posted-count').textContent = '0';
    return;
  }
  var posted = items.filter(function(v) { return v.stage === 'posted'; }).length;
  document.getElementById('vx-posted-count').textContent = posted;
  el.innerHTML = items.map(function(v) {
    return '<div class="vx-item" id="vx-' + v.id + '">' +
      '<span class="vx-title" title="' + v.name + '">' + v.title + (v.week ? ' <span style="color:var(--muted);font-size:11px;">· ' + v.week + '</span>' : '') + '</span>' +
      '<span class="vx-stage stage-' + v.stage + '" onclick="advanceVX(' + v.id + ',this)" title="Click to advance stage">' + v.stage + '</span>' +
    '</div>';
  }).join('');
}

function advanceVX(id, badgeEl) {
  badgeEl.style.opacity = '0.4';
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.ok) {
        if (res.newStage === 'archived') {
          document.getElementById('vx-' + id).remove();
        } else {
          badgeEl.className = 'vx-stage stage-' + res.newStage;
          badgeEl.textContent = res.newStage;
        }
        badgeEl.style.opacity = '1';
        // recount posted
        var posted = document.querySelectorAll('.stage-posted').length;
        document.getElementById('vx-posted-count').textContent = posted;
      }
    })
    .withFailureHandler(function() { badgeEl.style.opacity = '1'; })
    .advanceVXStage(id);
}

function addVXItem() {
  var title = document.getElementById('vx-title').value.trim();
  if (!title) return;
  var btn = document.getElementById('btn-vx-add');
  btn.textContent = '...'; btn.disabled = true;
  google.script.run
    .withSuccessHandler(function() {
      document.getElementById('vx-title').value = '';
      btn.textContent = '+ Add'; btn.disabled = false;
      loadData();
    })
    .withFailureHandler(function() { btn.textContent = '+ Add'; btn.disabled = false; })
    .addVXVideo(title, document.getElementById('vx-week').value);
}

/* ── BOOT ─────────────────────────────────────────────────────────── */
var refreshTimer = null;

function loadData() {
  document.getElementById('last-updated').textContent = 'Refreshing...';
  google.script.run
    .withSuccessHandler(function(data) {
      renderAll(data);
      scheduleNextRefresh(data.refreshMinutes || 5);
    })
    .withFailureHandler(function(e) {
      document.getElementById('last-updated').textContent = 'Error — ' + e.message;
      scheduleNextRefresh(5); // retry in 5 min even on failure
    })
    .getData();
}

function scheduleNextRefresh(minutes) {
  if (refreshTimer) clearTimeout(refreshTimer);
  var ms = minutes * 60 * 1000;
  var nextAt = new Date(Date.now() + ms);
  var h = nextAt.getHours(), m = nextAt.getMinutes();
  var ampm = h >= 12 ? 'PM' : 'AM';
  document.getElementById('next-refresh').textContent =
    'Next refresh ' + ((h % 12) || 12) + ':' + pad(m) + ' ' + ampm;
  refreshTimer = setTimeout(loadData, ms);
}

loadData();
</script>
